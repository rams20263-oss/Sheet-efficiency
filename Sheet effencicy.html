<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet Cut Optimizer — Minimal Waste Cutting Diagram</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      .print-break { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 12h16M12 4v16" />
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">Sheet Cut Optimizer</h1>
          <p class="text-xs text-slate-500">Multi-sheet 2D cutting layout, cut angles &amp; waste minimizer</p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <select id="unitSelect" class="text-xs sm:text-sm border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="in">Inches / Feet (e.g. 6' or 26")</option>
          <option value="mm">Millimeters (mm)</option>
          <option value="cm">Centimeters (cm)</option>
        </select>
        <button id="loadExampleBtn" type="button" class="text-xs sm:text-sm px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-medium transition">
          Load 6'×3' Example
        </button>
        <button id="printBtn" type="button" class="text-xs sm:text-sm px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-medium transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          Print / PDF
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- Left Sidebar: Inputs -->
    <section class="lg:col-span-4 space-y-5 no-print">
      <!-- Stock Sheets Card (Multi-Sheet + Editable + Stepper) -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 sm:p-5">
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-700">1. Available Stock Sheets</h2>
          <button id="clearSheetsBtn" type="button" class="text-xs text-rose-600 hover:text-rose-700 font-medium">Clear</button>
        </div>
        <p class="text-[11px] text-slate-400 mb-3">Type directly or use <span class="font-semibold text-slate-600">-</span> (-1) and <span class="font-semibold text-slate-600">+</span> (+5)</p>

        <!-- Add Stock Sheet Form -->
        <form id="addSheetForm" class="space-y-2.5 mb-3 pb-3 border-b border-slate-100">
          <input id="sheetLabelInput" type="text" placeholder="Sheet name (optional, e.g. Leftover 2×4)" class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label for="sheetLen" class="block text-[11px] font-medium text-slate-500 mb-0.5">Length</label>
              <div class="flex items-stretch border border-slate-300 rounded-lg overflow-hidden bg-white focus-within:ring-2 focus-within:ring-indigo-500">
                <button type="button" data-step-target="sheetLen" data-step="-1" class="step-form-btn px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs border-r border-slate-200" title="-1">-</button>
                <input id="sheetLen" type="text" required placeholder="6'" class="w-full min-w-0 px-1.5 py-1.5 text-xs text-center focus:outline-none" />
                <button type="button" data-step-target="sheetLen" data-step="5" class="step-form-btn px-2 bg-slate-100 hover:bg-indigo-100 text-indigo-700 font-bold text-xs border-l border-slate-200" title="+5">+</button>
              </div>
            </div>
            <div>
              <label for="sheetWid" class="block text-[11px] font-medium text-slate-500 mb-0.5">Width</label>
              <div class="flex items-stretch border border-slate-300 rounded-lg overflow-hidden bg-white focus-within:ring-2 focus-within:ring-indigo-500">
                <button type="button" data-step-target="sheetWid" data-step="-1" class="step-form-btn px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs border-r border-slate-200" title="-1">-</button>
                <input id="sheetWid" type="text" required placeholder="3'" class="w-full min-w-0 px-1.5 py-1.5 text-xs text-center focus:outline-none" />
                <button type="button" data-step-target="sheetWid" data-step="5" class="step-form-btn px-2 bg-slate-100 hover:bg-indigo-100 text-indigo-700 font-bold text-xs border-l border-slate-200" title="+5">+</button>
              </div>

            <div>

              <div class="flex items-stretch border border-slate-300 rounded-lg overflow-hidden bg-white focus-within:ring-2 focus-within:ring-indigo-500">
                <button type="button" data-step-target="sheetQty" data-step="-1" data-is-qty="1" class="step-form-btn px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs border-r border-slate-200" title="-1">-</button>

            </div>
          </div>
          <div class="flex items-center justify-between gap-2 pt-0.5">
            <div class="flex flex-wrap gap-1">
              <button type="button" data-preset="6',3'" class="preset-btn text-[11px] px-2 py-1 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 font-medium transition">6' × 3'</button>
              <button type="button" data-preset="2',4'" class="preset-btn text-[11px] px-2 py-1 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 font-medium transition">2' × 4'</button>

              <button type="button" data-preset="7',4'" class="preset-btn text-[11px] px-2 py-1 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 font-medium transition">7' × 4'</button>
              <button type="button" data-preset="4',4'" class="preset-btn text-[11px] px-2 py-1 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 font-medium transition">4' × 4'</button>

            <button type="submit" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition shadow-sm shrink-0">
              + Add Sheet
            </button>
          </div>
        </form>

        <!-- Editable Stock Sheets List -->
        <div id="sheetsList" class="space-y-2 max-h-64 overflow-y-auto pr-1 mb-3"></div>

        <!-- Global Kerf & Rotation -->
        <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-slate-100">
          <div>
            <label for="kerfInput" class="block text-[11px] font-medium text-slate-600 mb-1">Blade Kerf (cut gap)</label>
            <input id="kerfInput" type="text" value="0" placeholder="e.g. 0 or 0.125" class="w-full px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />

        </div>
        <p class="text-[11px] text-slate-400 mb-3">Click to type, or tap <span class="font-semibold text-slate-600">-</span> (-1) / <span class="font-semibold text-slate-600">+</span> (+5)</p>

        <!-- Add Piece Form -->
        <form id="addPieceForm" class="space-y-2.5 mb-4 pb-3 border-b border-slate-100">
          <input id="pieceLabel" type="text" placeholder="Label (optional, e.g. Side Panel)" class="w-full px-2.5 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <div class="grid grid-cols-3 gap-2">
            <div>

                <input id="pieceLen" type="text" required placeholder='22"' class="w-full min-w-0 px-1.5 py-1.5 text-xs text-center focus:outline-none" />

            </div>
            <div>
              <label for="pieceWid" class="block text-[11px] font-medium text-slate-500 mb-0.5">Width</label>
              <div class="flex items-stretch border border-slate-300 rounded-lg overflow-hidden bg-white focus-within:ring-2 focus-within:ring-indigo-500">
                <button type="button" data-step-target="pieceWid" data-step="-1" class="step-form-btn px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs border-r border-slate-200" title="-1">-</button>
                <input id="pieceWid" type="text" required placeholder='26"' class="w-full min-w-0 px-1.5 py-1.5 text-xs text-center focus:outline-none" />
                <button type="button" data-step-target="pieceWid" data-step="5" class="step-form-btn px-2 bg-slate-100 hover:bg-indigo-100 text-indigo-700 font-bold text-xs border-l border-slate-200" title="+5">+</button>
              </div>
            </div>
            <div>
              <label for="pieceQty" class="block text-[11px] font-medium text-slate-500 mb-0.5">Qty</label>
              <div class="flex items-stretch border border-slate-300 rounded-lg overflow-hidden bg-white focus-within:ring-2 focus-within:ring-indigo-500">
                <button type="button" data-step-target="pieceQty" data-step="-1" data-is-qty="1" class="step-form-btn px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs border-r border-slate-200" title="-1">-</button>
                <input id="pieceQty" type="number" min="1" max="100" value="1" required class="w-full min-w-0 px-1 py-1.5 text-xs text-center focus:outline-none" />
                <button type="button" data-step-target="pieceQty" data-step="5" data-is-qty="1" class="step-form-btn px-2 bg-slate-100 hover:bg-indigo-100 text-indigo-700 font-bold text-xs border-l border-slate-200" title="+5">+</button>
              </div>
            </div>
          </div>
          <div class="flex items-center justify-between gap-2 pt-0.5">
            <label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">
              <input id="pieceRotate" type="checkbox" checked class="rounded text-indigo-600" />
              <span>Can rotate 90°</span>
            </label>
            <button type="submit" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold transition shadow-sm">
              + Add Piece
            </button>
          </div>
        </form>

        <!-- Editable Pieces List -->
        <div id="piecesList" class="space-y-2.5 max-h-96 overflow-y-auto pr-1"></div>
      </div>

      <button id="optimizeBtn" type="button" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        Calculate Best Cut Layout
      </button>
    </section>

    <!-- Right Main Area: KPIs, Diagrams & Cut Guide -->
    <section class="lg:col-span-8 space-y-5">
      <div id="alertBanner" class="hidden rounded-xl border px-4 py-3 text-sm font-medium"></div>

      <!-- Summary KPIs -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-white rounded-xl border border-slate-200 p-3.5 shadow-sm">
          <div class="text-xs text-slate-500 font-medium">Sheets Used</div>
          <div id="kpiSheets" class="text-xl font-bold text-slate-900 mt-0.5">—</div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-3.5 shadow-sm">
          <div class="text-xs text-slate-500 font-medium">Sheet Efficiency</div>
          <div id="kpiEfficiency" class="text-xl font-bold text-emerald-600 mt-0.5">—</div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-3.5 shadow-sm">
          <div class="text-xs text-slate-500 font-medium">Used Area</div>
          <div id="kpiUsedArea" class="text-xl font-bold text-slate-900 mt-0.5">—</div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-3.5 shadow-sm">
          <div class="text-xs text-slate-500 font-medium">Waste / Offcut</div>
          <div id="kpiWaste" class="text-xl font-bold text-amber-600 mt-0.5">—</div>
        </div>
      </div>

      <!-- Diagrams Container -->
      <div id="diagramsContainer" class="space-y-6"></div>
    </section>
  </main>

  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden bg-slate-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-lg shadow-lg"></div>

  <script>
    // ---------- State & Constants ----------
    const PALETTE = [
      { bg: '#dbeafe', border: '#2563eb', text: '#1e3a8a' },
      { bg: '#dcfce7', border: '#16a34a', text: '#14532d' },
      { bg: '#fef3c7', border: '#d97706', text: '#78350f' },
      { bg: '#fce7f3', border: '#db2777', text: '#831843' },
      { bg: '#ede9fe', border: '#7c3aed', text: '#4c1d95' },
      { bg: '#cffafe', border: '#0891b2', text: '#164e63' },
      { bg: '#ffedd5', border: '#ea580c', text: '#7c2d12' },
      { bg: '#e0e7ff', border: '#4f46e5', text: '#312e81' }
    ];

    let state = {
      unit: 'in',
      kerfStr: "0",
      allowRotateGlobal: true,
      sheets: [
        { id: 1, label: 'Main Sheet', lenStr: "6'", widStr: "3'", qty: 1 },
        { id: 2, label: 'Leftover Sheet', lenStr: "2'", widStr: "4'", qty: 1 }
      ],
      nextSheetId: 3,
      pieces: [
        { id: 1, label: 'Piece A', lenStr: '22"', widStr: '26"', qty: 2, canRotate: true },
        { id: 2, label: 'Piece B', lenStr: '26"', widStr: '26"', qty: 1, canRotate: true },
        { id: 3, label: 'Piece C', lenStr: '24"', widStr: '20"', qty: 1, canRotate: true }
      ],
      nextPieceId: 4
    };

    // ---------- Dimension Parsing & Stepping ----------
    function parseDim(raw, unit) {
      if (raw === null || raw === undefined) return NaN;
      let s = String(raw).trim().toLowerCase();
      if (!s) return NaN;

      if (unit === 'in') {
        const ftInMatch = s.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft)\s*(\d+(?:\.\d+)?)?\s*(?:"|in)?$/);
        if (ftInMatch) {
          const ft = parseFloat(ftInMatch[1]) || 0;
          const inc = parseFloat(ftInMatch[2]) || 0;
          return ft * 12 + inc;
        }
        const inMatch = s.match(/^(\d+(?:\.\d+)?)\s*(?:"|in)?$/);
        if (inMatch) {
          return parseFloat(inMatch[1]);
        }
      }

      const num = parseFloat(s.replace(/[^\d.]/g, ''));
      return isNaN(num) ? NaN : num;
    }

    function stepValue(currentStr, delta, isQty, unit) {
      if (isQty) {
        const cur = parseInt(currentStr, 10);
        const base = isNaN(cur) ? 1 : cur;
        return Math.max(1, base + delta);
      }
      const parsed = parseDim(currentStr, unit);
      const base = isNaN(parsed) ? 0 : parsed;
      const next = Math.max(1, Math.round((base + delta) * 100) / 100);
      return unit === 'in' ? `${next}"` : `${next}`;
    }

    function formatDim(val, unit) {
      const rounded = Math.round(val * 100) / 100;
      if (unit === 'in') return `${rounded}"`;
      return `${rounded} ${unit}`;
    }

    function formatArea(area, unit) {
      if (unit === 'in') {
        const sqft = area / 144;
        return `${Math.round(area).toLocaleString()} in² (${sqft.toFixed(1)} ft²)`;
      }
      return `${Math.round(area).toLocaleString()} ${unit}²`;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ---------- Multi-Sheet 2D Guillotine Bin Packing Engine ----------
    function packSheets(availableSheets, kerf, items, allowGlobalRotate) {
      const sortStrategies = [
        (a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h),
        (a, b) => (b.w * b.h) - (a.w * a.h),
        (a, b) => b.h - a.h || b.w - a.w,
        (a, b) => b.w - a.w || b.h - a.h
      ];
      const sheetOrders = [
        (a, b) => (a.w * a.h) - (b.w * b.h),
        (a, b) => (b.w * b.h) - (a.w * a.h),
        null
      ];
      const splitModes = ['shorterLeftover', 'longerLeftover', 'verticalFirst', 'horizontalFirst'];

      let bestResult = null;

      for (const sheetOrder of sheetOrders) {
        const orderedPool = sheetOrder ? [...availableSheets].sort(sheetOrder) : [...availableSheets];
        for (const sortFn of sortStrategies) {
          for (const splitMode of splitModes) {
            const res = runGuillotine(orderedPool, kerf, [...items].sort(sortFn), allowGlobalRotate, splitMode);
            if (!bestResult || isBetterResult(res, bestResult)) {
              bestResult = res;
            }
          }
        }
      }
      return bestResult;
    }

    function isBetterResult(a, b) {
      if (a.unplaced.length !== b.unplaced.length) return a.unplaced.length < b.unplaced.length;
      if (a.totalWaste !== b.totalWaste) return a.totalWaste < b.totalWaste;
      return a.sheets.length < b.sheets.length;
    }

    function runGuillotine(sheetPool, kerf, sortedItems, allowGlobalRotate, splitMode) {
      const openedSheets = [];
      let nextPoolIdx = 0;
      const unplaced = [];

      for (const item of sortedItems) {
        let placedFlag = false;

        for (const sheet of openedSheets) {
          if (tryPlaceInSheet(sheet, item, kerf, allowGlobalRotate, splitMode)) {
            placedFlag = true;
            break;
          }
        }

        if (!placedFlag) {
          for (let p = nextPoolIdx; p < sheetPool.length; p++) {
            const candidateMeta = sheetPool[p];
            const fitsNormal = item.w <= candidateMeta.w + 1e-6 && item.h <= candidateMeta.h + 1e-6;
            const fitsRot = allowGlobalRotate && item.canRotate && item.h <= candidateMeta.w + 1e-6 && item.w <= candidateMeta.h + 1e-6;
            if (fitsNormal || fitsRot) {
              const chosen = sheetPool.splice(p, 1)[0];
              sheetPool.splice(nextPoolIdx, 0, chosen);
              nextPoolIdx++;

              const newSheet = {
                index: openedSheets.length + 1,
                label: chosen.label,
                w: chosen.w,
                h: chosen.h,
                placed: [],
                freeRects: [{ x: 0, y: 0, w: chosen.w, h: chosen.h }]
              };
              if (tryPlaceInSheet(newSheet, item, kerf, allowGlobalRotate, splitMode)) {
                openedSheets.push(newSheet);
                placedFlag = true;
                break;
              }
            }
          }
        }

        if (!placedFlag) {
          unplaced.push(item);
        }
      }

      const totalSheetArea = openedSheets.reduce((acc, s) => acc + s.w * s.h, 0);
      const usedArea = openedSheets.reduce((acc, s) => acc + s.placed.reduce((pAcc, p) => pAcc + p.w * p.h, 0), 0);
      return {
        sheets: openedSheets,
        unplaced,
        usedArea,
        totalSheetArea,
        totalWaste: totalSheetArea - usedArea
      };
    }

    function tryPlaceInSheet(sheet, item, kerf, allowGlobalRotate, splitMode) {
      let bestScore = Infinity;
      let bestRectIdx = -1;
      let bestOrient = null;

      const orientations = [{ w: item.w, h: item.h, rotated: false }];
      if (allowGlobalRotate && item.canRotate && item.w !== item.h) {
        orientations.push({ w: item.h, h: item.w, rotated: true });
      }

      for (let i = 0; i < sheet.freeRects.length; i++) {
        const r = sheet.freeRects[i];
        for (const o of orientations) {
          if (o.w <= r.w + 1e-6 && o.h <= r.h + 1e-6) {
            const leftoverW = r.w - o.w;
            const leftoverH = r.h - o.h;
            const shortSide = Math.min(leftoverW, leftoverH);
            const areaFit = (r.w * r.h) - (o.w * o.h);
            const score = areaFit * 1000 + shortSide;
            if (score < bestScore) {
              bestScore = score;
              bestRectIdx = i;
              bestOrient = o;
            }
          }
        }
      }

      if (bestRectIdx === -1) return false;

      const rect = sheet.freeRects.splice(bestRectIdx, 1)[0];
      const pw = bestOrient.w;
      const ph = bestOrient.h;

      sheet.placed.push({
        uid: item.uid,
        groupId: item.groupId,
        label: item.label,
        origW: item.w,
        origH: item.h,
        x: rect.x,
        y: rect.y,
        w: pw,
        h: ph,
        rotated: bestOrient.rotated,
        color: item.color
      });

      const remW = Math.max(0, rect.w - pw - (rect.w - pw > 0 ? kerf : 0));
      const remH = Math.max(0, rect.h - ph - (rect.h - ph > 0 ? kerf : 0));

      let splitHorizontal = true;
      if (splitMode === 'verticalFirst') splitHorizontal = false;
      else if (splitMode === 'horizontalFirst') splitHorizontal = true;
      else if (splitMode === 'shorterLeftover') splitHorizontal = remW < remH;
      else splitHorizontal = remW >= remH;

      if (splitHorizontal) {
        if (remW > 0.01) sheet.freeRects.push({ x: rect.x + pw + kerf, y: rect.y, w: remW, h: ph });
        if (remH > 0.01) sheet.freeRects.push({ x: rect.x, y: rect.y + ph + kerf, w: rect.w, h: remH });
      } else {
        if (remH > 0.01) sheet.freeRects.push({ x: rect.x, y: rect.y + ph + kerf, w: pw, h: remH });
        if (remW > 0.01) sheet.freeRects.push({ x: rect.x + pw + kerf, y: rect.y, w: remW, h: rect.h });
      }

      return true;
    }

    function generateCutInstructions(sheet, unit) {
      const cuts = [];
      const seenLines = new Set();

      sheet.placed.forEach((p) => {
        const rightEdge = Math.round((p.x + p.w) * 100) / 100;
        const bottomEdge = Math.round((p.y + p.h) * 100) / 100;

        if (rightEdge < sheet.w - 0.01) {
          const key = `V:${rightEdge}`;
          if (!seenLines.has(key)) {
            seenLines.add(key);
            cuts.push({
              type: 'V',
              angle: '90° Vertical (Cross Cut)',
              pos: rightEdge,
              x1: rightEdge, y1: p.y, x2: rightEdge, y2: p.y + p.h,
              desc: `Cut at ${formatDim(rightEdge, unit)} from left edge (90° vertical) for ${p.label}`
            });
          }
        }
        if (bottomEdge < sheet.h - 0.01) {
          const key = `H:${bottomEdge}`;
          if (!seenLines.has(key)) {
            seenLines.add(key);
            cuts.push({
              type: 'H',
              angle: '0° Horizontal (Rip Cut)',
              pos: bottomEdge,
              x1: p.x, y1: bottomEdge, x2: p.x + p.w, y2: bottomEdge,
              desc: `Cut at ${formatDim(bottomEdge, unit)} from top edge (0° horizontal) for ${p.label}`
            });
          }
        }
      });

      cuts.sort((a, b) => a.pos - b.pos);
      return cuts.map((c, idx) => ({ ...c, step: idx + 1 }));
    }

            <button type="button" data-action="del-sheet" class="w-6 h-6 rounded border border-rose-200 bg-white text-rose-600 hover:bg-rose-50 text-xs font-bold shrink-0" title="Remove sheet">×</button>

    function optimizeAndRender() {
      const unit = state.unit;
      const kerf = Math.max(0, parseDim(state.kerfStr, unit) || 0);
      const alertEl = document.getElementById('alertBanner');
      alertEl.classList.add('hidden');

      const availableSheets = [];
      let invalidSheet = false;
      state.sheets.forEach((s, idx) => {
        const w = parseDim(s.lenStr, unit);
        const h = parseDim(s.widStr, unit);
        const qty = Math.max(1, parseInt(s.qty, 10) || 1);
        if (!w || !h || w <= 0 || h <= 0) {
          invalidSheet = true;
          return;
        }
        for (let q = 0; q < qty; q++) {
          availableSheets.push({
            sheetId: `${s.id}-${q}`,
            label: s.label || `Sheet ${idx + 1}`,
            w,
            h
          });
        }
      });

      if (invalidSheet || availableSheets.length === 0) {
        alertEl.className = 'rounded-xl border border-rose-200 bg-rose-50 text-rose-800 px-4 py-3 text-sm font-medium';
        alertEl.textContent = availableSheets.length === 0
          ? 'Please add at least one stock sheet.'
          : 'One or more stock sheets have invalid dimensions.';
        alertEl.classList.remove('hidden');
        document.getElementById('diagramsContainer').innerHTML = '';
        return;
      }

      const expandedItems = [];
      let invalidPiece = false;
      state.pieces.forEach((p, idx) => {
        const w = parseDim(p.lenStr, unit);
        const h = parseDim(p.widStr, unit);
        const qty = Math.max(1, parseInt(p.qty, 10) || 1);
        if (!w || !h || w <= 0 || h <= 0) {
          invalidPiece = true;
          return;
        }
        const color = PALETTE[idx % PALETTE.length];
        for (let q = 0; q < qty; q++) {
          expandedItems.push({
            uid: `${p.id}-${q}`,
            groupId: p.id,
            label: p.label || `Piece ${idx + 1}`,
            w,
            h,
            canRotate: p.canRotate,
            color
          });
        }
      });

      if (invalidPiece) {
        alertEl.className = 'rounded-xl border border-rose-200 bg-rose-50 text-rose-800 px-4 py-3 text-sm font-medium';
        alertEl.textContent = 'One or more cut pieces have invalid dimensions.';
        alertEl.classList.remove('hidden');
        return;
      }

      const result = packSheets(availableSheets, kerf, expandedItems, state.allowRotateGlobal);

      const eff = result.totalSheetArea > 0 ? (result.usedArea / result.totalSheetArea) * 100 : 0;
      document.getElementById('kpiSheets').textContent = `${result.sheets.length} / ${availableSheets.length}`;
      document.getElementById('kpiEfficiency').textContent = `${eff.toFixed(1)}%`;
      document.getElementById('kpiUsedArea').textContent = formatArea(result.usedArea, unit);
      document.getElementById('kpiWaste').textContent = formatArea(result.totalWaste, unit);

      if (result.unplaced.length > 0) {
        alertEl.className = 'rounded-xl border border-amber-300 bg-amber-50 text-amber-900 px-4 py-3 text-sm font-medium';
        const names = result.unplaced.map(u => `${u.label} (${formatDim(u.w, unit)} × ${formatDim(u.h, unit)})`).join(', ');
        alertEl.textContent = `Could not fit ${result.unplaced.length} piece(s) into your available sheets: ${names}. Add another stock sheet or allow 90° rotation.`;
        alertEl.classList.remove('hidden');
      }

      const container = document.getElementById('diagramsContainer');
      if (result.sheets.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-500 text-sm">
            Add cut pieces on the left to generate your cutting diagram.
          </div>
        `;
        return;
      }

      container.innerHTML = result.sheets.map((sheet) => {
        const sheetUsed = sheet.placed.reduce((acc, p) => acc + p.w * p.h, 0);
        const sheetEff = ((sheetUsed / (sheet.w * sheet.h)) * 100).toFixed(1);
        const cuts = generateCutInstructions(sheet, unit);

        const svgW = 760;
        const pad = 36;
        const drawW = svgW - pad * 2;
        const scale = drawW / sheet.w;
        const drawH = sheet.h * scale;
        const svgH = drawH + pad * 2;

        const piecesSvg = sheet.placed.map((p) => {
          const rx = pad + p.x * scale;
          const ry = pad + p.y * scale;
          const rw = p.w * scale;
          const rh = p.h * scale;
          const fontSize = Math.max(9, Math.min(13, Math.min(rw, rh) * 0.16));
          const rotBadge = p.rotated ? '90° Rotated' : '0° Normal';
          return `
            <g class="piece-group cursor-pointer" data-uid="${p.uid}">
              <rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="${p.color.bg}" stroke="${p.color.border}" stroke-width="2" rx="2" />
              <text x="${rx + rw / 2}" y="${ry + rh / 2 - fontSize * 0.6}" text-anchor="middle" dominant-baseline="middle" fill="${p.color.text}" font-size="${fontSize}" font-weight="700">${escapeHtml(p.label)}</text>
              <text x="${rx + rw / 2}" y="${ry + rh / 2 + fontSize * 0.65}" text-anchor="middle" dominant-baseline="middle" fill="${p.color.text}" font-size="${Math.max(8, fontSize * 0.85)}" font-weight="500">${formatDim(p.w, unit)} × ${formatDim(p.h, unit)}</text>
              ${rh > 42 && rw > 55 ? `<text x="${rx + rw / 2}" y="${ry + rh / 2 + fontSize * 1.75}" text-anchor="middle" dominant-baseline="middle" fill="${p.color.text}" font-size="${Math.max(7.5, fontSize * 0.72)}" opacity="0.85">${rotBadge}</text>` : ''}
            </g>
          `;
        }).join('');

        const wasteSvg = sheet.freeRects.filter(r => r.w > 0.5 && r.h > 0.5).map((r) => {
          const rx = pad + r.x * scale;
          const ry = pad + r.y * scale;
          const rw = r.w * scale;
          const rh = r.h * scale;
          return `
            <g>
              <rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="url(#wasteHatch)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" />
              ${rw > 46 && rh > 22 ? `<text x="${rx + rw / 2}" y="${ry + rh / 2}" text-anchor="middle" dominant-baseline="middle" fill="#64748b" font-size="10" font-weight="500">Waste ${formatDim(r.w, unit)}×${formatDim(r.h, unit)}</text>` : ''}
            </g>
          `;
        }).join('');

        const cutLinesSvg = cuts.map((c) => {
          const x1 = pad + c.x1 * scale;
          const y1 = pad + c.y1 * scale;
          const x2 = pad + c.x2 * scale;
          const y2 = pad + c.y2 * scale;
          const mx = (x1 + x2) / 2;
          const my = (y1 + y2) / 2;
          return `
            <g>
              <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" />
              <circle cx="${mx}" cy="${my}" r="9" fill="#dc2626" />
              <text x="${mx}" y="${my + 0.5}" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-size="9" font-weight="700">C${c.step}</text>
            </g>
          `;
        }).join('');

        return `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden print-break">
            <div class="px-4 sm:px-5 py-3 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 text-xs font-bold">Sheet #${sheet.index}</span>
                <span class="text-sm font-semibold text-slate-800">${escapeHtml(sheet.label)} (${formatDim(sheet.w, unit)} × ${formatDim(sheet.h, unit)})</span>
              </div>
              <div class="text-xs font-medium text-slate-600">
                ${sheet.placed.length} pieces · <span class="text-emerald-600 font-bold">${sheetEff}% used</span>
              </div>
            </div>

            <div class="p-4 overflow-x-auto">
              <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-auto max-w-full select-none">
                <defs>
                  <pattern id="wasteHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2" />
                  </pattern>
                </defs>
                <rect x="${pad}" y="${pad}" width="${drawW}" height="${drawH}" fill="#f8fafc" stroke="#334155" stroke-width="2.5" />
                <text x="${pad + drawW / 2}" y="${pad - 12}" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">Length: ${formatDim(sheet.w, unit)}</text>
                <text x="${pad - 14}" y="${pad + drawH / 2}" text-anchor="middle" fill="#334155" font-size="12" font-weight="600" transform="rotate(-90 ${pad - 14} ${pad + drawH / 2})">Width: ${formatDim(sheet.h, unit)}</text>

                ${wasteSvg}
                ${piecesSvg}
                ${cutLinesSvg}
              </svg>
            </div>

            <div class="px-4 sm:px-5 py-3.5 bg-slate-50/60 border-t border-slate-100">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">How &amp; What Angle to Cut (Sheet #${sheet.index})</h3>
              ${cuts.length === 0 ? `<p class="text-xs text-slate-500">Full sheet used — no internal cuts required.</p>` : `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  ${cuts.map(c => `
                    <div class="flex items-start gap-2 text-xs bg-white border border-slate-200 rounded-lg px-3 py-2">
                      <span class="w-5 h-5 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center shrink-0 text-[10px]">C${c.step}</span>
                      <div>
                        <div class="font-semibold text-slate-800">${c.angle}</div>
                        <div class="text-slate-600">${escapeHtml(c.desc)}</div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    // ---------- Event Listeners ----------
    function syncGlobalInputs() {
      document.getElementById('unitSelect').value = state.unit;
      document.getElementById('kerfInput').value = state.kerfStr;
      document.getElementById('allowRotateGlobal').checked = state.allowRotateGlobal;
    }

    // Form Stepper Buttons (-1 / +5)
    document.querySelectorAll('.step-form-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.stepTarget);
        if (!target) return;
        const delta = parseInt(btn.dataset.step, 10);
        const isQty = btn.dataset.isQty === '1';
        target.value = stepValue(target.value, delta, isQty, state.unit);
      });
    });

    document.getElementById('unitSelect').addEventListener('change', (e) => {
      state.unit = e.target.value;
      optimizeAndRender();
    });

    document.getElementById('kerfInput').addEventListener('input', (e) => {
      state.kerfStr = e.target.value;
      optimizeAndRender();
    });

    document.getElementById('allowRotateGlobal').addEventListener('change', (e) => {
      state.allowRotateGlobal = e.target.checked;
      optimizeAndRender();
    });

    document.querySelectorAll('.preset-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const [l, w] = btn.dataset.preset.split(',');
        document.getElementById('sheetLen').value = l;
        document.getElementById('sheetWid').value = w;
      });
    });

    // Add Stock Sheet
    document.getElementById('addSheetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const label = document.getElementById('sheetLabelInput').value.trim();
      const lenStr = document.getElementById('sheetLen').value.trim();
      const widStr = document.getElementById('sheetWid').value.trim();
      const qty = Math.max(1, parseInt(document.getElementById('sheetQty').value, 10) || 1);

      const w = parseDim(lenStr, state.unit);
      const h = parseDim(widStr, state.unit);
      if (!w || !h || w <= 0 || h <= 0) {
        showToast("Enter valid sheet dimensions (e.g. 6' or 2')");
        return;
      }

      state.sheets.push({
        id: state.nextSheetId++,
        label: label || `Sheet ${state.sheets.length + 1}`,
        lenStr,
        widStr,
        qty
      });

      document.getElementById('sheetLabelInput').value = '';
      document.getElementById('sheetLen').value = '';
      document.getElementById('sheetWid').value = '';
      document.getElementById('sheetQty').value = '1';

      renderSheetsList();
      optimizeAndRender();
      showToast('Added stock sheet');
    });

    // Inline Edit, Stepper (-1/+5) & Delete for Stock Sheets
    document.getElementById('sheetsList').addEventListener('input', (e) => {
      const row = e.target.closest('[data-sheet-id]');
      if (!row) return;
      const id = parseInt(row.dataset.sheetId, 10);
      const sheet = state.sheets.find(s => s.id === id);
      if (!sheet) return;
      const field = e.target.dataset.field;
      if (field === 'qty') sheet.qty = Math.max(1, parseInt(e.target.value, 10) || 1);
      else if (field) sheet[field] = e.target.value;
      optimizeAndRender();
    });

    document.getElementById('sheetsList').addEventListener('click', (e) => {
      const stepBtn = e.target.closest('button[data-action="step"]');
      if (stepBtn) {
        const row = stepBtn.closest('[data-sheet-id]');
        const id = parseInt(row.dataset.sheetId, 10);
        const sheet = state.sheets.find(s => s.id === id);
        if (!sheet) return;
        const field = stepBtn.dataset.field;
        const delta = parseInt(stepBtn.dataset.step, 10);
        const isQty = stepBtn.dataset.isQty === '1';
        sheet[field] = stepValue(sheet[field], delta, isQty, state.unit);
        const inputEl = row.querySelector(`input[data-field="${field}"]`);
        if (inputEl) inputEl.value = sheet[field];
        optimizeAndRender();
        return;
      }

      const delBtn = e.target.closest('button[data-action="del-sheet"]');
      if (!delBtn) return;
      const row = delBtn.closest('[data-sheet-id]');
      const id = parseInt(row.dataset.sheetId, 10);
      state.sheets = state.sheets.filter(s => s.id !== id);
      renderSheetsList();
      optimizeAndRender();
    });

    document.getElementById('clearSheetsBtn').addEventListener('click', () => {
      state.sheets = [];
      renderSheetsList();
      optimizeAndRender();
    });

    // Add Cut Piece
    document.getElementById('addPieceForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const label = document.getElementById('pieceLabel').value.trim();
      const lenStr = document.getElementById('pieceLen').value.trim();
      const widStr = document.getElementById('pieceWid').value.trim();
      const qty = Math.max(1, parseInt(document.getElementById('pieceQty').value, 10) || 1);
      const canRotate = document.getElementById('pieceRotate').checked;

      const w = parseDim(lenStr, state.unit);
      const h = parseDim(widStr, state.unit);
      if (!w || !h || w <= 0 || h <= 0) {
        showToast('Enter valid piece dimensions (e.g. 22" or 3\')');
        return;
      }

      state.pieces.push({
        id: state.nextPieceId++,
        label: label || `Piece ${state.pieces.length + 1}`,
        lenStr,
        widStr,
        qty,
        canRotate
      });

      document.getElementById('pieceLabel').value = '';
      document.getElementById('pieceLen').value = '';
      document.getElementById('pieceWid').value = '';
      document.getElementById('pieceQty').value = '1';

      renderPiecesList();
      optimizeAndRender();
    });

    // Inline Edit, Stepper (-1/+5) & Delete for Cut Pieces
    document.getElementById('piecesList').addEventListener('input', (e) => {
      const row = e.target.closest('[data-piece-id]');
      if (!row) return;
      const id = parseInt(row.dataset.pieceId, 10);
      const piece = state.pieces.find(p => p.id === id);
      if (!piece) return;
      const field = e.target.dataset.field;
      if (!field) return;
      if (field === 'qty') piece.qty = Math.max(1, parseInt(e.target.value, 10) || 1);
      else if (field === 'canRotate') piece.canRotate = e.target.checked;
      else piece[field] = e.target.value;
      optimizeAndRender();
    });

    document.getElementById('piecesList').addEventListener('change', (e) => {
      if (e.target.dataset.field === 'canRotate') {
        const row = e.target.closest('[data-piece-id]');
        if (!row) return;
        const id = parseInt(row.dataset.pieceId, 10);
        const piece = state.pieces.find(p => p.id === id);
        if (piece) {
          piece.canRotate = e.target.checked;
          optimizeAndRender();
        }
      }
    });

    document.getElementById('piecesList').addEventListener('click', (e) => {
      const stepBtn = e.target.closest('button[data-action="step"]');
      if (stepBtn) {
        const row = stepBtn.closest('[data-piece-id]');
        const id = parseInt(row.dataset.pieceId, 10);
        const piece = state.pieces.find(p => p.id === id);
        if (!piece) return;
        const field = stepBtn.dataset.field;
        const delta = parseInt(stepBtn.dataset.step, 10);
        const isQty = stepBtn.dataset.isQty === '1';
        piece[field] = stepValue(piece[field], delta, isQty, state.unit);
        const inputEl = row.querySelector(`input[data-field="${field}"]`);
        if (inputEl) inputEl.value = piece[field];
        optimizeAndRender();
        return;
      }

      const delBtn = e.target.closest('button[data-action="del-piece"]');
      if (!delBtn) return;
      const row = delBtn.closest('[data-piece-id]');
      const id = parseInt(row.dataset.pieceId, 10);
      state.pieces = state.pieces.filter(p => p.id !== id);
      renderPiecesList();
      optimizeAndRender();
    });

    document.getElementById('clearPiecesBtn').addEventListener('click', () => {
      state.pieces = [];
      renderPiecesList();
      optimizeAndRender();
      showToast('Cleared all cut pieces');
    });

    document.getElementById('loadExampleBtn').addEventListener('click', () => {
      state.unit = 'in';
      state.kerfStr = "0";
      state.allowRotateGlobal = true;
      state.sheets = [
        { id: 1, label: 'Main Sheet', lenStr: "6'", widStr: "3'", qty: 2 }
      ];
      state.nextSheetId = 2;
      state.pieces = [
        { id: 1, label: 'Piece A', lenStr: '22"', widStr: '26"', qty: 2, canRotate: true },
        { id: 2, label: 'Piece B', lenStr: '26"', widStr: '26"', qty: 2, canRotate: true },
        { id: 3, label: 'Piece C', lenStr: '42"', widStr: "3'", qty: 1, canRotate: true }
      ];
      state.nextPieceId = 4;
      syncGlobalInputs();
      renderSheetsList();
      renderPiecesList();
      optimizeAndRender();
      showToast("Loaded 6' × 3' example");
    });

    document.getElementById('optimizeBtn').addEventListener('click', () => {
      optimizeAndRender();
      showToast('Layout recalculated for minimum waste');
    });

    document.getElementById('printBtn').addEventListener('click', () => {
      window.print();
    });

    // Initial render
    syncGlobalInputs();
    renderSheetsList();
    renderPiecesList();
    optimizeAndRender();
  </script>
</body>
</html>
